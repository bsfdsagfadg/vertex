version: "2"
run:
  tests: true
linters:
  default: none
  enable:
    - bodyclose
    - copyloopvar
    - errcheck
    - exhaustive
    - gochecknoglobals
    - gochecknoinits
    - gochecksumtype
    - govet
    - ineffassign
    - staticcheck
    - unconvert
    - unused
  settings:
    gochecksumtype:
      default-signifies-exhaustive: false
    govet:
      disable:
        - fieldalignment
        - shadow
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
